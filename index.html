<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Clock</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
    body { color: #ecf8ff; font-family: Arial, Helvetica, sans-serif; }
    #clock-wrap { position: absolute; top: 50px; left: 50px; }
    #clock {
      display: inline-block;
      padding: 32px 40px;
      border: 1px solid #2fa8dc;
      border-radius: 16px;
      background-color: rgba(17, 21, 67, 0.7);
      color: #ecf8ff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 96px;
      font-weight: bold;
      line-height: 1;
      letter-spacing: -3px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="clock-wrap"><div id="clock">--:--</div></div>
  <script>
    function updateClock() {
      var now = new Date();
      var hours = now.getHours();
      var minutes = now.getMinutes();
      if (minutes < 10) { minutes = "0" + minutes; }
      document.getElementById("clock").innerHTML = hours + ":" + minutes;
    }

    updateClock();
    window.setInterval(updateClock, 1000);
  </script>
</body>
</html>
